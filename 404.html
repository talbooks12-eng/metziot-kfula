<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - העמוד לא נמצא | מציאות כפולה</title>
    <link rel="icon" type="image/png" href="assets/book-cover.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Rubik', sans-serif;
            background: #FAF7F2;
            color: #2D2926;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 600;
            color: #8B7355;
            line-height: 1;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #2D2926;
        }
        p {
            font-size: 1.1rem;
            color: #5C5652;
            margin-bottom: 2rem;
            max-width: 400px;
        }
        .home-btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: #8B7355;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .home-btn:hover {
            background: #6B5744;
            transform: translateY(-2px);
        }
        .book-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="book-icon">📖</div>
    <div class="error-code">404</div>
    <h1>אופס! העמוד לא נמצא</h1>
    <p>נראה שהלכת לאיבוד... בדיוק כמו בין שני עולמות. בוא נחזיר אותך הביתה.</p>
    <a href="/" class="home-btn">חזרה לעמוד הראשי</a>
</body>
</html>
